limit_req_zone $binary_remote_addr zone=itwhite_lead:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=itwhite_lead_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name www.itwhite.ru;
    return 301 https://itwhite.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name itwhite.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.itwhite.ru;

    ssl_certificate /etc/letsencrypt/live/itwhite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itwhite.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://itwhite.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itwhite.ru;

    ssl_certificate /etc/letsencrypt/live/itwhite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itwhite.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # The Astro app also protects direct/internal responses. Hide those
    # upstream copies at the public proxy boundary so each header is emitted
    # exactly once by Nginx.
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://mc.yandex.ru https://hdrc.yandex.net; connect-src 'self' https://mc.yandex.ru https://hdrc.yandex.net; frame-src https://mc.yandex.ru" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location = /ai-in-operations { return 308 /ai-automation/$is_args$args; }
    location = /ai-in-operations/ { return 308 /ai-automation/$is_args$args; }
    location = /internal-business-system { return 308 /internal-tools/$is_args$args; }
    location = /internal-business-system/ { return 308 /internal-tools/$is_args$args; }
    location = /diagnose { return 308 /formats/$is_args$args; }
    location = /diagnose/ { return 308 /formats/$is_args$args; }

    location ~ ^/(?!api(?:/|$)|_astro(?:/|$)|\.well-known(?:/|$))[^.]*[^/]$ {
        return 308 $scheme://$host$uri/$is_args$args;
    }

    location ^~ /_astro/ {
        expires 1y;
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /images/ {
        expires 1d;
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/lead {
        client_max_body_size 6m;
        client_body_timeout 15s;
        limit_req zone=itwhite_lead burst=3 nodelay;
        limit_req_status 429;
        limit_conn itwhite_lead_conn 1;
        limit_conn_status 429;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
    }

    location / {
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
