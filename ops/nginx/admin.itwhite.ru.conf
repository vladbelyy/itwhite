limit_req_zone $binary_remote_addr zone=itwhite_admin_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.itwhite.ru;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.itwhite.ru;

    ssl_certificate /etc/letsencrypt/live/admin.itwhite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.itwhite.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/admin.itwhite.ru.access.log;
    error_log /var/log/nginx/admin.itwhite.ru.error.log;

    client_max_body_size 10m;
    limit_req_status 429;

    auth_basic "IT WHITE private workspace";
    auth_basic_user_file /etc/nginx/.htpasswd-itwhite-admin;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Bootstrap and password-reset email are intentionally unavailable on the
    # public edge. The owner is seeded server-side; email delivery will be
    # enabled only after a real adapter replaces Payload's console fallback.
    location = /admin/create-first-user { return 404; }
    location = /api/users/first-register { return 404; }
    location = /admin/forgot { return 404; }
    location = /api/users/forgot-password { return 404; }

    location = /api/users/login {
        limit_req zone=itwhite_admin_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4323;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:4323;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
