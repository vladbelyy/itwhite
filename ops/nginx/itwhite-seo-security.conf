# Include these directives in the itwhite.ru TLS server block. Test with
# `nginx -t` before reload. The slash rule intentionally excludes API routes,
# build assets, well-known files and any path whose final segment has an
# extension, so POST /api/lead is never redirected.

location = /ai-in-operations { return 308 /ai-automation/$is_args$args; }
location = /ai-in-operations/ { return 308 /ai-automation/$is_args$args; }
location = /internal-business-system { return 308 /internal-tools/$is_args$args; }
location = /internal-business-system/ { return 308 /internal-tools/$is_args$args; }
location = /diagnose { return 308 /formats/$is_args$args; }
location = /diagnose/ { return 308 /formats/$is_args$args; }

location ~ ^/(?!api(?:/|$)|_astro(?:/|$)|\.well-known(?:/|$))(.+[^/])$ {
    if ($uri !~ "\.[A-Za-z0-9]{1,8}$") {
        return 308 $scheme://$host$uri/$is_args$args;
    }
}

add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://mc.yandex.ru https://hdrc.yandex.net; connect-src 'self' https://mc.yandex.ru https://hdrc.yandex.net; frame-src https://mc.yandex.ru" always;

location ^~ /images/ {
    expires 1d;
    try_files $uri @itwhite_upstream;
}

# The parent server config must provide the named application upstream used by
# the cache location above, for example:
# location @itwhite_upstream { proxy_pass http://127.0.0.1:4322; }
